name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # macos-26: Xcode 26 / macOS 26 SDK (Metal 4 tensor test compiled in)
    # macos-15: older SDK, checks that the build still works without Metal 4
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Swift Version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Run Tests
        run: swift test

      - name: Verify Binary
        run: |
          ./.build/release/osx-bench --help
          ./.build/release/osx-bench info
          ./.build/release/osx-bench run --help
          ./.build/release/osx-bench run --auto-accept
          ./.build/release/osx-bench run --advanced --auto-accept
